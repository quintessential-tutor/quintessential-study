<style>
:root{--bg:#f1ede6;--surface:#fcfbf8;--ink:#2b2622;--mute:#7a7268;--line:#ddd5c9;--c:#b0a088;--cd:color-mix(in srgb,var(--c) 72%,#000);--cs:color-mix(in srgb,var(--c) 9%,var(--surface));--on:#fff;--ok:#1d8a4b;--bad:#c93c3c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}

main{max-width:720px;margin:0 auto;padding:22px 20px 64px}

.tutors{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}

.tile{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 8px 14px;transition:border-color .2s,box-shadow .2s;animation:in .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*55ms + 120ms)}

.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 20%;border-radius:14px;background:var(--line)}

.hd{display:flex;gap:18px;align-items:center;margin:8px 0 24px}

.line{margin:-6px 0 24px;padding-left:14px;border-left:3px solid var(--c);color:var(--mute)}

.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:17px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;font-weight:600;transition:border-color .2s,transform .2s}
.row:hover{border-color:var(--c);transform:translateX(3px)}.row .t{flex:1}
.tag{font-style:normal;font-size:12px;font-weight:600;color:var(--cd);background:var(--cs);padding:2px 9px;border-radius:99px;margin-left:10px}
.best{font-size:13px;font-weight:600;color:var(--cd)}

.tabs{position:relative;display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{flex:1;background:none;border:0;padding:12px 0;font:500 15px Figtree,sans-serif;color:var(--mute);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:600}
.tabs::after{content:"";position:absolute;left:0;bottom:-1px;width:33.333%;height:2px;background:var(--c);transform:translateX(calc(var(--i)*100%));transition:transform .3s cubic-bezier(.3,.8,.3,1)}
.acc{border-bottom:1px solid var(--line)}
.acc button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 2px;background:none;border:0;color:var(--ink);text-align:left;cursor:pointer;font:400 22px 'Cormorant Garamond',Georgia,serif}
.pl{position:relative;flex:none;width:14px;height:14px}.pl::before,.pl::after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;border-radius:2px;background:var(--cd);transition:transform .25s}.pl::after{transform:rotate(90deg)}.open .pl::after{transform:none}
.pn{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.open .pn{grid-template-rows:1fr}.pn>div{overflow:hidden}

.opt{display:block;width:100%;text-align:left;margin:8px 0 0;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 16px Figtree,sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--c)}.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.picks .opt{margin:0;text-align:center;padding:18px 8px}.picks b{display:block;font:400 34px/1.1 'Cormorant Garamond',Georgia,serif}.picks small{color:var(--mute)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.meta{margin:0 0 8px;font-size:14px;color:var(--mute)}.q h2{font-size:28px;line-height:1.2;margin-bottom:10px}
.fb{display:flex;gap:12px;align-items:center;margin:18px 0 14px}.fb p{margin:0;color:var(--mute)}
.btn{border:0;border-radius:99px;background:var(--cd);color:var(--on);padding:11px 22px;font:600 15px Figtree,sans-serif;cursor:pointer;transition:transform .15s}.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}.btn.sm{padding:7px 16px;font-size:14px}
.res{text-align:center}.res .fb{justify-content:center;margin:6px 0 0}.ring{display:block;width:150px;height:150px;margin:0 auto 6px}.rt{font:400 32px 'Cormorant Garamond',Georgia,serif;fill:var(--ink)}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.sec{margin-bottom:34px}.sh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.nb{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 0}
.chip{flex:none;max-width:190px;padding:6px 14px;border:1.5px solid var(--line);border-radius:99px;background:none;color:var(--mute);font:500 14px Figtree,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip[aria-current=true]{background:var(--cs);border-color:var(--c);color:var(--cd)}
.ed{padding:12px 18px 16px}
.nt{width:100%;margin:0 0 6px;padding:6px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:400 28px 'Cormorant Garamond',Georgia,serif}
.ed textarea{display:block;width:100%;min-height:224px;margin:0;padding:0;border:0;resize:vertical;color:var(--ink);font:400 16px/28px Figtree,sans-serif;background:linear-gradient(transparent 27px,var(--line) 27px) 0 0/100% 28px local}
.nf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)}
.lnk{background:none;border:0;color:var(--bad);font:500 13px Figtree,sans-serif;cursor:pointer;padding:4px 0}
.empty{padding:26px 20px;text-align:center;color:var(--mute)}.empty p{margin:0}
.vl{display:grid;gap:8px}
.v{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.v a{flex:1;min-width:0;display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none;font-weight:500}.v a:hover .tx{color:var(--cd)}
.v small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.ply{position:relative;flex:none;width:34px;height:34px;border-radius:50%;background:var(--cs)}.ply::after{content:"";position:absolute;left:13px;top:10px;border:7px solid transparent;border-left:11px solid var(--cd);border-right:0}
.v button{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px}
.add{display:grid;gap:8px;margin-top:12px;justify-items:start}
.fi{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.err{margin:0;color:var(--bad);font-size:14px}
.srch{display:inline-block;margin-top:14px;color:var(--cd);font-weight:600;text-decoration:none}

@keyframes in{from{opacity:0;transform:translateY(8px)}}.view{animation:in .4s cubic-bezier(.2,.8,.2,1)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--c);outline-offset:2px}

.subs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(min-width:620px){.subs{grid-template-columns:repeat(3,1fr)}}

.sc:hover,.sc.sel{transform:translateY(-5px);box-shadow:0 18px 30px -22px var(--c)}.sc.sel{background:var(--cs)}

.hd.c{flex-direction:column;text-align:center;gap:12px;margin:6px 0 4px}.hd.c .pf{width:108px;height:108px}.hd.c .say{font-size:19px;max-width:34ch;margin:6px auto 0}
.card,.nb,.v,.opt,.fi{border-radius:6px}

notes:[['Data Representation',['Denary is base 10, binary base 2, hexadecimal base 16 (0–9, A–F). One hex digit = 4 bits.','Binary → denary: add the place values 128, 64, 32, 16, 8, 4, 2, 1 wherever there is a 1.','Binary addition: 0+0=0, 0+1=1, 1+1=10 (carry 1). A result too big for the register causes overflow.','Logical shifts: a left shift multiplies by 2 per place, a right shift divides by 2; bits shifted out are lost.','Two’s complement: the most significant bit has a negative place value (−128 in 8 bits). To negate, invert the bits and add 1.','ASCII uses 7 or 8 bits per character; Unicode uses more bits to cover every language and emoji.','Image file size = width × height × colour depth (bits). More resolution or depth gives better quality but a bigger file.','Sound file size = sample rate × bit depth × seconds. Higher values give better quality but a bigger file.','Lossless compression (e.g. run-length encoding) keeps all the data; lossy compression (e.g. JPEG, MP3) permanently removes data.']],
['Hardware & Software',['CPU parts: ALU (arithmetic and logic), control unit (decodes instructions), registers, cache and buses.','Fetch–decode–execute: fetch the instruction from RAM, decode it in the control unit, execute it, repeat.','Performance rises with higher clock speed, more cores and more cache.','RAM is volatile main memory; ROM is non-volatile and holds start-up instructions. Secondary storage: magnetic (HDD), solid state (SSD), optical.','Operating system: manages memory, files, users, security, input/output and multitasking.','Compiler: translates the whole program at once into an executable. Interpreter: translates and runs line by line, so errors show sooner.','Embedded systems are computers built into devices (washing machines, cars) to do one dedicated job.']],
['Networks & the Internet',['LAN covers a small area; WAN covers a large area (the Internet is the biggest WAN).','Router connects networks; switch connects devices in a LAN; NIC lets a device join a network.','Packet switching: data is split into packets with headers (destination, order), sent by different routes and reassembled.','IP addresses identify a device on a network and can change; MAC addresses are fixed by the manufacturer.','Protocols: HTTP/HTTPS (web), FTP (files), SMTP/IMAP/POP (email), TCP/IP (packets). DNS turns a domain name into an IP address.','Error checking: parity bit, checksum, echo check and automatic repeat request (ARQ).','Encryption scrambles data with a key; symmetric uses one key, asymmetric uses a public and a private key.']],
['Security & Ethics',['Threats: malware (virus, worm, spyware, ransomware), phishing, pharming, brute-force attacks and DDoS.','Protection: firewall, anti-malware, strong passwords, two-factor authentication, software updates, SSL/TLS.','Ethics: respect copyright and licences (open source vs proprietary), protect privacy, and consider the impact of AI and automation.','Data protection law: personal data must be collected fairly, kept secure and accurate, and not kept longer than needed.']],
['Algorithms & Programming',['Flowchart shapes: oval = start/stop, rectangle = process, parallelogram = input/output, diamond = decision.','Building blocks: sequence, selection (IF…THEN…ELSE, CASE) and iteration (FOR, WHILE, REPEAT…UNTIL).','Data structures: variables, constants, 1D and 2D arrays, records and files.','A procedure does a task; a function returns a value. Parameters pass data in.','Validation checks data is sensible (range, length, type, presence, format). Verification checks it was entered correctly (double entry, visual check).','Trace tables record variable values step by step, which is how you find logic errors.','Linear search checks each item in turn; binary search halves a sorted list each time. Bubble sort swaps neighbours until no swaps are needed.','Test with normal, boundary and erroneous data. Error types: syntax, logic and runtime.']],
['Logic Gates & Databases',['AND: 1 only if both inputs are 1. OR: 1 if either input is 1. NOT: inverts the input.','NAND = NOT AND; NOR = NOT OR; XOR = 1 only when the inputs differ.','A truth table lists every input combination (2ⁿ rows); work through the gates in order.','A database table has records (rows) and fields (columns); each record needs a unique primary key.','SQL: SELECT fields FROM table WHERE condition ORDER BY field; SUM and COUNT summarise data.']],
['Exam Tips',['Command words: state = brief fact; describe = what happens; explain = what happens and why.','Show working for binary and hex conversions; method marks are awarded.','Worked example: 0110 1001₂ = 64 + 32 + 8 + 1 = 105 in denary = 69 in hex.','Trace code by hand on paper before checking it on a computer.']]],
quiz:[['Which part of the CPU carries out calculations and logical comparisons?',['ALU','Control unit','Address bus','Clock']],['What does DNS do?',['Turns a domain name into an IP address','Encrypts web traffic','Blocks malware','Assigns MAC addresses']],['Which type of compression permanently removes data?',['Lossy','Lossless','Run-length','Parity']],['Which check is a validation check?',['Range check','Double entry','Visual check','Proof-reading']],['A firewall…',['Monitors and filters network traffic','Speeds up the CPU','Compresses files','Stores backups']],['Which translator runs a program line by line?',['Interpreter','Compiler','Linker','Debugger']],['Which search needs the list to be sorted first?',['Binary search','Linear search','Bubble sort','Neither']],['What does a primary key do?',['Uniquely identifies each record','Encrypts a field','Sorts the table','Links to the Internet']],['Which memory is volatile?',['RAM','ROM','SSD','HDD']],['What does ARQ stand for?',['Automatic repeat request','Automated read query','Array retrieval queue','Address resolution query']],['In a flowchart, which shape shows a decision?',['Diamond','Rectangle','Oval','Parallelogram']]]});

const MORE={
physics:['Exam Technique',['Command words: state = one fact; describe = what happens; explain = what happens and why; calculate = formula, substitution, answer with unit.','Write the equation, substitute with units, then give the answer with its unit to a sensible number of significant figures.','Graphs: read the axes and units first; gradient = change in y ÷ change in x; area under a graph often has its own meaning (distance, work done).','Practicals: name the independent, dependent and control variables, give a method step, one risk and one way to improve accuracy.']],
english:['Exam Technique',['Command words: identify = pick from the text; explain = give a reason; analyse = comment on the effect of the writer’s methods; compare = similarities and differences with evidence.','PEEL paragraphs: Point, Evidence, Explain, Link back to the question. Keep quotations short and embed them in your sentence.','Spend five minutes planning writing: audience, purpose, form, three or four paragraph ideas and a strong ending.','Proofread in the last five minutes: capital letters, full stops, common spellings and a consistent tense.']],
business:['Exam Technique',['Command words: define = give the meaning; explain = a reason developed with “because… which leads to…”; justify = a decision backed by evidence; evaluate = weigh both sides, then conclude.','Apply every answer to the case: name the business, product or numbers in the context.','Calculations: write the formula, show workings and add units (£, %, units) every time.','Evaluation: give both sides, make a judgement and say what it depends on, such as business size, timescale or market.']],
chemistry:['Exam Technique',['Command words: describe = say what you see; explain = use particles or bonding as the reason; suggest = apply knowledge to an unfamiliar context.','Balance every equation, check atoms and charges, and add state symbols (s), (l), (g), (aq).','Mole calculations: moles → ratio from the equation → mass, volume or concentration. Show each step.','Observations: give colour changes, precipitates and gases with their tests; do not name the product instead of describing what you observe.']],
mathematics:['Exam Technique',['Show every step: method marks are awarded even when the final answer is wrong.','Check the calculator is in degree mode and avoid rounding until the final answer; give 3 significant figures unless told otherwise.','Estimate first: does the answer make sense? A length cannot be negative and a probability cannot exceed 1.','If you are stuck, write down known facts, label the diagram and move on. Return with the remaining time.']],
computer:['Trace Tables & Testing',['A trace table has one column per variable and one row per change; update only the variable that changes on each line.','Test data: normal (expected), boundary (on the limit) and erroneous (should be rejected). Always state the expected result.','Errors: syntax (breaks the language rules), logic (runs but gives wrong output) and runtime (crashes while running).','Validation checks data is sensible (range, length, type, presence); verification checks it was entered correctly (double entry, visual check).']]
};
S.forEach(s=>MORE[s.id]&&s.notes.push(MORE[s.id]));
S.push({id:'psychology',n:7,title:'Psychology',notes:[
['Memory',['Multi-store model (Atkinson and Shiffrin): sensory register → short-term memory → long-term memory, with rehearsal moving information on. Short-term memory holds about 7 ± 2 items for roughly 18–30 seconds; long-term memory is unlimited.','Working memory model (Baddeley and Hitch): central executive, phonological loop, visuo-spatial sketchpad and episodic buffer.','Types of long-term memory: episodic (events), semantic (facts) and procedural (skills).','Reconstructive memory (Bartlett): we rebuild memories using schemas, so recall is shaped by expectation and can be distorted.','Eyewitness testimony: leading questions (Loftus and Palmer: “smashed” gave higher speed estimates than “hit”) and post-event information change accounts. The cognitive interview improves recall: report everything, reinstate the context, change the order, change the perspective.']],
['Perception',['Sensation is detecting a stimulus; perception is interpreting it.','Depth cues: monocular (height in plane, relative size, occlusion, linear perspective) and binocular (retinal disparity, convergence).','Visual illusions such as the Müller-Lyer and Ponzo show the brain applying depth rules to flat images.','Gregory: perception is constructive and top-down, using past experience. Gibson: perception is direct and bottom-up from the optic array.','Perceptual set: expectation, culture and motivation shape what we see (Bruner and Minturn: the same shape seen as a letter B or the number 13).']],
['Development',['Piaget’s stages: sensorimotor (0–2), preoperational (2–7), concrete operational (7–11), formal operational (11+). Key terms: schema, assimilation, accommodation, object permanence, conservation, egocentrism.','The three mountains task shows egocentrism in preoperational children; conservation tasks show concrete operational thinking.','Vygotsky: learning is social. The zone of proximal development is what a child can do with help; scaffolding comes from a more knowledgeable other.','Baillargeon found object permanence in infants of about 3.5 months, suggesting Piaget underestimated them.','Dweck: a growth mindset (ability can improve) leads to more effort than a fixed mindset, so praise effort and strategy.']],
['Social Influence',['Types of conformity: compliance (go along in public), identification (adopt the view while in the group) and internalisation (genuinely change your view).','Explanations: informational social influence (we think others are right) and normative social influence (we want to be accepted).','Asch (1951): about 32% of responses conformed; conformity fell when one confederate disagreed.','Milgram (1963): 65% gave the maximum 450 V. Obedience fell when the experimenter was absent, wore ordinary clothes or the setting was less prestigious.','Zimbardo’s prison study showed the power of social roles. Ethical issues: deception, informed consent, protection from harm and the right to withdraw.','Resisting influence: social support and an internal locus of control.']],
['Research Methods',['Hypotheses: directional predicts the direction of a difference; non-directional only predicts a difference. The null hypothesis predicts no difference.','Variables: independent (changed), dependent (measured), extraneous and confounding variables must be controlled.','Experiments: laboratory (high control, low realism), field (more realistic), natural (the IV is not manipulated). Designs: independent groups, repeated measures (order effects) and matched pairs.','Sampling: random, systematic, stratified, opportunity and volunteer. A representative sample allows generalisation.','Reliability is consistency; validity is measuring what you claim. Ethics: consent, deception, protection, withdrawal, confidentiality and debrief.']],
['Brain & Psychological Problems',['Cortex lobes: frontal (movement, planning), parietal (touch), temporal (hearing, memory), occipital (vision). Broca’s area produces speech; Wernicke’s area understands it.','Scanning: fMRI and PET show activity; EEG records electrical activity; CT shows structure.','Phobias: learned by classical conditioning and social learning; treated by systematic desensitisation or flooding.','Depression: Beck’s negative triad (self, world, future); treated by CBT or antidepressants such as SSRIs.','Addiction: risk factors include genes, stress and peer influence; treatments include aversion therapy and CBT.']],
['Exam Technique',['Command words: describe = say what happens; explain = give a reason; evaluate = strengths, weaknesses and a conclusion.','Use named studies with the researcher, a finding and a figure where you can (for example Milgram: 65% at 450 V).','For scenario questions, quote the context, then link it to a theory or study.','Long answers: plan three points, then use PEEL (Point, Evidence, Explain, Link) in each paragraph.']]],
quiz:[['Which model of memory includes a central executive?',['Working memory model','Multi-store model','Reconstructive memory','Levels of processing']],['In Milgram’s original study, what percentage gave the maximum 450 V?',['65%','32%','10%','95%']],['Which type of long-term memory stores facts?',['Semantic','Episodic','Procedural','Sensory']],['Piaget’s second stage is called…',['Preoperational','Sensorimotor','Concrete operational','Formal operational']],['Which sampling method gives everyone an equal chance of selection?',['Random','Opportunity','Volunteer','Quota']],['Which treatment gradually exposes a person to a feared object while relaxed?',['Systematic desensitisation','Flooding','Aversion therapy','Antidepressants']]]});
S.push({id:'accounting',n:8,title:'Accounting',notes:[
['Fundamentals',['Accounting equation: Assets = Capital + Liabilities, so Capital = Assets − Liabilities.','Double entry: every transaction has a debit and a credit. Debit expenses, assets and drawings; credit liabilities, income and capital.','Documents: invoice, credit note, debit note, statement of account, receipt and cheque.','Books of prime entry: sales, purchases and returns journals, cash book, petty cash book and the journal. Entries are then posted to the ledgers.']],
['Trial Balance & Errors',['A trial balance lists all ledger balances; total debits should equal total credits.','Errors that do not affect the totals: omission, commission, principle, original entry, compensating and reversal.','Errors that do: a one-sided entry, different amounts on each side and addition mistakes. Use a suspense account until they are found.','Correct errors with journal entries, with a narrative that explains the correction.']],
['Final Accounts',['Income statement: revenue − cost of sales = gross profit; gross profit − expenses = profit for the year.','Cost of sales = opening inventory + purchases − closing inventory (adjust purchases for returns and carriage inwards).','Statement of financial position: non-current assets + current assets − current liabilities − non-current liabilities = capital + profit − drawings.','Order assets by liquidity: inventory, receivables, bank, cash.']],
['Adjustments',['Straight-line depreciation = (cost − residual value) ÷ useful life. Reducing balance applies a percentage to net book value each year.','Disposal of a non-current asset: profit or loss = proceeds − net book value.','Accruals are expenses owed (add to the expense, current liability). Prepayments are paid in advance (deduct from the expense, current asset).','Irrecoverable debts are written off; the allowance for doubtful debts is a percentage of receivables, and only the change in it goes to the income statement.','Inventory is valued at the lower of cost and net realisable value (prudence).']],
['Control Accounts & Bank Reconciliation',['A sales ledger control account checks the individual receivables accounts: opening balance + credit sales − returns − cash received − discounts allowed = closing balance.','Bank reconciliation compares the cash book with the bank statement.','Timing differences: unpresented cheques and uncredited lodgements. Update the cash book first for bank charges, direct debits, standing orders and dishonoured cheques.']],
['Ratios & Analysis',['Gross profit margin = gross profit ÷ revenue × 100. Profit margin = profit for the year ÷ revenue × 100.','ROCE = profit from operations ÷ capital employed × 100; capital employed = total assets − current liabilities.','Current ratio = current assets ÷ current liabilities. Liquid (acid test) ratio = (current assets − inventory) ÷ current liabilities.','Inventory turnover = cost of sales ÷ average inventory. Receivables days = receivables ÷ credit sales × 365.','Comment on a ratio by comparing it with last year or a competitor, then give a reason for the change.']],
['Partnerships & Companies',['Partnership: profit is shared by the agreement (ratio, salaries, interest on capital, interest on drawings). The appropriation account shows the split.','Each partner has a capital account (fixed) and a current account (profit share less drawings).','Limited company: share capital (ordinary and preference), dividends, retained earnings and debentures (loans with interest).','Limited liability: shareholders can lose only what they invested.']],
['Exam Technique',['Show the formula and workings; marks are given for method even when the answer is wrong.','Use correct headings and layout for the income statement, statement of financial position and ledger accounts, with dates and balance b/d, c/d.','Check that the statement of financial position balances and that every figure has a £ sign where required.','Read the question for the period (year ended…) and whether figures are before or after adjustments.']]],

S.push({id:'biology',n:9,title:'Biology',notes:[
['Cells & Microscopy',['Eukaryotic cells (animals, plants, fungi) have a nucleus; prokaryotic cells (bacteria) have no nucleus, with DNA in a single loop and sometimes extra plasmids.','Animal cell parts: nucleus (controls the cell and holds DNA), cytoplasm (where reactions happen), cell membrane (controls what enters and leaves), mitochondria (aerobic respiration) and ribosomes (protein synthesis).','Plant cells also have a cellulose cell wall (strength), a permanent vacuole (cell sap) and chloroplasts (photosynthesis).','Magnification = image size ÷ real size. 1 mm = 1000 µm. Electron microscopes give higher magnification and resolution than light microscopes.','Specialised cells: sperm (tail, many mitochondria), nerve cells (long axon), root hair cells (large surface area) and muscle cells (many mitochondria, able to contract).']],
['Transport & Cell Division',['Diffusion: the net movement of particles from a higher to a lower concentration. A larger surface area, higher temperature and steeper gradient all speed it up.','Osmosis: the movement of water across a partially permeable membrane from a dilute solution to a more concentrated solution.','Active transport: moves substances against a concentration gradient and needs energy from respiration, for example mineral ions into root hair cells.','Mitosis: produces two genetically identical diploid cells for growth and repair. The chromosomes are copied first, then the cell divides.','Stem cells: undifferentiated cells that can become specialised. Embryonic stem cells can become any type; adult stem cells are more limited.']],
['Digestion & Enzymes',['Enzymes: biological catalysts made of protein. The substrate fits the active site (lock and key model).','Enzymes work best at an optimum temperature and pH. High temperatures or extreme pH denature them by changing the shape of the active site.','Digestive enzymes: amylase breaks starch into sugars, protease breaks protein into amino acids and lipase breaks lipids into fatty acids and glycerol.','Bile: made in the liver and stored in the gall bladder. It neutralises stomach acid and emulsifies fat to give lipase a larger surface area.','Food tests: iodine turns blue-black with starch; Benedict’s solution turns orange-red on heating with sugars; biuret turns purple with protein; the ethanol emulsion test turns cloudy white with lipids.']],
['Heart, Blood & Vessels',['Heart: the right ventricle pumps blood to the lungs and the left ventricle pumps it to the body, so the left wall is thicker. Valves stop backflow.','Blood vessels: arteries carry blood away from the heart at high pressure with thick elastic walls; veins carry blood back with valves; capillaries are one cell thick for exchange.','Blood: red blood cells carry oxygen using haemoglobin and have no nucleus; white blood cells fight infection; platelets help clotting; plasma carries dissolved substances.','Coronary heart disease: fatty deposits narrow the coronary arteries. Treatments include statins, stents and bypass surgery.','Cardiac output = stroke volume × heart rate.']],
['Infection & Response',['Pathogens: bacteria (Salmonella), viruses (measles, HIV), fungi (rose black spot) and protists (malaria) cause communicable disease.','Defences: skin, nasal hairs and mucus, and stomach acid. White blood cells engulf pathogens (phagocytosis) and make antibodies and antitoxins.','Vaccination: a harmless form of a pathogen makes memory cells, so antibodies are made quickly if you are infected. Herd immunity protects people who cannot be vaccinated.','Antibiotics: kill bacteria but not viruses. Overuse leads to resistant strains such as MRSA.','Drug testing: new drugs are tested on cells and animals, then in clinical trials; double-blind trials reduce bias.']],
['Photosynthesis & Respiration',['Photosynthesis: carbon dioxide + water → glucose + oxygen, using light absorbed by chlorophyll in chloroplasts. It is endothermic.','Limiting factors: light intensity, carbon dioxide concentration and temperature can all restrict the rate of photosynthesis.','Uses of glucose: respiration, starch for storage, cellulose for cell walls, and proteins made with nitrate ions from the soil.','Aerobic respiration: glucose + oxygen → carbon dioxide + water. It releases energy and is exothermic.','Anaerobic respiration: releases less energy. In muscles glucose → lactic acid; in yeast glucose → ethanol + carbon dioxide (fermentation).']],
['Homeostasis & Hormones',['Reflex arc: stimulus → receptor → sensory neurone → coordinator (CNS) → motor neurone → effector → response. Reflexes are fast, automatic and protective.','Hormones: chemical messengers made by endocrine glands and carried in the blood. The pituitary is the “master gland”.','Blood glucose: insulin (from the pancreas) lowers it and glucagon raises it. In type 1 diabetes the pancreas makes too little insulin; in type 2 cells stop responding to it.','Menstrual cycle: FSH matures an egg, oestrogen rebuilds the uterus lining, LH triggers ovulation and progesterone maintains the lining.','Temperature control: when hot, sweating and vasodilation; when cold, shivering and vasoconstriction.']],
['Inheritance & Evolution',['DNA: a double helix. A gene is a section of DNA that codes for a protein; the genome is all of an organism’s genes. Humans have 23 pairs of chromosomes.','Alleles: different versions of a gene. A dominant allele always shows; a recessive allele shows only with two copies. Homozygous means two identical alleles; heterozygous means two different ones.','Genotype is the alleles you have and phenotype is the characteristics you show. A cross of Aa × Aa gives 3 dominant to 1 recessive, so 25% are aa.','Meiosis: makes four genetically different gametes with half the chromosomes. Fertilisation restores the full number.','Sex determination: females are XX and males are XY, so each child has a 50% chance of being a boy.','Natural selection: individuals with useful variation survive, reproduce and pass on their alleles. Humans also use selective breeding and genetic engineering.']],
['Ecology',['Food chains: producer → primary consumer → secondary consumer → tertiary consumer. Only about 10% of energy passes to the next level, so chains are short.','Sampling: estimate population = mean per quadrat × total area ÷ quadrat area. Transects show how distribution changes across a habitat.','Carbon cycle: photosynthesis removes carbon dioxide; respiration, decomposition and combustion return it to the air.','Biodiversity: the variety of living things. Fertiliser run-off causes eutrophication: algae bloom, die, and decay uses up the oxygen.','Adaptations: structural (thick fur), behavioural (migration) or functional (hibernation).']],
['Exam Technique',['Command words: describe = say what happens; explain = give the biology that causes it; compare = similarities and differences; evaluate = weigh the evidence, then conclude.','Graph questions: read the axes and units, describe the trend using figures, then explain it with biology.','Use key terms precisely: write “partially permeable membrane”, “denatured” and “active site”, not “the enzyme dies”.','Practicals: name the independent, dependent and control variables, and improve reliability by repeating and calculating a mean.']]],
quiz:[['Which organelle is the site of aerobic respiration?',['Mitochondria','Ribosomes','Chloroplasts','Nucleus']],['Water moving across a partially permeable membrane is called…',['Osmosis','Diffusion','Active transport','Transpiration']],['Which enzyme breaks down starch?',['Amylase','Protease','Lipase','Catalase']],['Which vessels carry blood away from the heart?',['Arteries','Veins','Capillaries','Venules']],['Which is the word equation for photosynthesis?',['Carbon dioxide + water → glucose + oxygen','Glucose + oxygen → carbon dioxide + water','Glucose → lactic acid','Carbon dioxide + oxygen → glucose + water']],['Which hormone lowers blood glucose?',['Insulin','Glucagon','Adrenaline','Thyroxine']],['Two heterozygous parents (Aa × Aa) have a child. What is the chance it is aa?',['25%','50%','75%','0%']],['Which test shows the presence of protein?',['Biuret test','Iodine test','Benedict’s test','Ethanol emulsion test']]]});

const GUIDE={
physics:{'Forces & Momentum':'A resultant force changes motion: it speeds an object up, slows it down or changes its direction. Think of a tug of war: only the unbalanced part matters. If the forces balance, the object keeps doing what it was already doing, even if that is standing still.','Energy':'Energy is never created or destroyed, only moved between stores such as kinetic, gravitational and thermal. When you describe a change, name the store that loses energy, the store that gains it and how it moves. Some always ends up as wasted thermal energy, so no machine is 100% efficient.'},
english:{'Summary Writing':'A summary is not a shorter copy of the text. Choose only the points the question asks for, then rewrite them in your own words. Highlight the key ideas, cross out examples and repetition, then join what is left with linking words so it reads as one flowing paragraph.','Language Devices':'Naming a device earns little. The marks come from explaining the effect on the reader. After spotting a simile, metaphor or alliteration, say what picture or feeling it creates and why that suits the writer’s purpose, such as making danger feel closer.'},
business:{'Marketing':'Marketing matches what a business sells with what customers want, at a price they accept, in places they can find it, promoted so they know about it. These are the four Ps: product, price, place and promotion. Good answers apply each P to the business in the question.','Finance':'Finance questions test whether you can follow money in and out. Revenue is what comes in from sales; costs go out. Profit is the difference over a period, while cash flow is the timing of money actually in the bank. A profitable business can still run out of cash.'},
chemistry:{'Bonding':'Atoms bond to get a full outer shell of electrons. Metals lose electrons to non-metals, forming ions that attract strongly in ionic compounds. Non-metals share electrons in covalent bonds, forming molecules. The bond type explains melting points and conductivity, so always link properties back to the particles.','The Mole':'The mole is a counting unit for particles, like a dozen but far bigger. The relative formula mass is the mass of one mole in grams. To calculate, convert the mass to moles, use the ratio in the balanced equation, then convert the moles of the answer back to a mass or volume.'},
mathematics:{'Algebra':'Algebra uses letters for unknown numbers. Whatever you do to one side of an equation you must do to the other, so it stays balanced. Work backwards through the order of operations to isolate the letter, then check your answer by substituting it back in.','Trigonometry':'Trigonometry links the angles and sides of right-angled triangles. Label the hypotenuse, opposite and adjacent sides relative to your angle, then choose sine, cosine or tangent (SOH CAH TOA) depending on which two sides are involved. Check your calculator is in degrees.'},
computer:{'Networks & the Internet':'A network lets devices share data and resources. Data is split into small packets that can travel by different routes and are reassembled at the destination. Protocols are the agreed rules, such as HTTP for web pages and TCP/IP for delivery, and routers decide where each packet goes next.','Algorithms & Programming':'An algorithm is a step-by-step solution, planned before any code. Break the problem down, then use three building blocks: sequence, selection (if statements) and iteration (loops). Test it with a trace table so you can see how each variable changes line by line.'},
psychology:{'Memory':'Memory is a process, not a single place: information is encoded, stored and later retrieved. Models such as the multi-store and working memory models are simplified pictures that explain why we hold only a little in short-term memory and how rehearsal helps move things into long-term memory.','Social Influence':'Social influence is how other people change what we think and do. Conformity is going along with a group; obedience is following an instruction from an authority. Studies by Asch and Milgram show both are powerful, and that the situation, not just personality, shapes behaviour.'},
accounting:{'Final Accounts':'Final accounts answer two questions. The income statement shows whether the business made a profit over a period by comparing revenue with costs. The statement of financial position is a snapshot on one date of what the business owns (assets), owes (liabilities) and what the owner has put in (capital).','Adjustments':'Adjustments make the accounts fair by matching income and expenses to the period they belong to, not the date cash moved. Depreciation spreads the cost of an asset over its life, accruals add expenses owed, and prepayments remove expenses paid for the future.'},
biology:{'Digestion & Enzymes':'Food molecules are too big to cross the gut wall, so enzymes break them into small soluble molecules that can be absorbed into the blood. Each enzyme has an active site that fits only one substrate, which is why heat or the wrong pH, which change its shape, stop it working.','Inheritance & Evolution':'Genes are instructions for making proteins, passed on in gametes. Each gene has two alleles, one from each parent, and a dominant allele hides a recessive one. Over many generations, individuals with useful variations survive and breed, so those alleles become more common.'}};
const gd=(id,t)=>GUIDE[id]&&GUIDE[id][t]?`<p class="gd"><b>Understand it</b>${GUIDE[id][t]}</p>`:'';

/* ---- more chapter guides ---- */
const G3={
physics:{'Motion':'Motion questions all come from one idea: how position changes with time. Speed is distance ÷ time and acceleration is how quickly velocity changes. On a distance-time graph the gradient is speed; on a speed-time graph the gradient is acceleration and the area underneath is the distance travelled.','Electricity':'Current is the flow of charge, voltage is the push that drives it and resistance is how hard it is to push through. Picture water in pipes. In a series circuit the current is the same everywhere; in parallel the voltage is the same across each branch. V = I × R links all three.'},
english:{'Directed Writing':'Directed writing asks you to use a text and write for a particular reader, such as a letter or speech. Mark the audience, purpose and format first. Use details from the passage but put them in your own words, and match the tone to the reader: formal for an official, friendly for a peer.','Descriptive & Narrative':'Descriptive writing paints a scene using the senses; narrative writing tells a story with a beginning, a problem and an ending. Pick one clear focus, such as a single moment, rather than too much. Show feelings through detail instead of telling, and vary sentence length to control the pace.'},
business:{'Operations':'Operations is how a business turns inputs, such as labour, materials and machines, into outputs customers buy. The main decisions are the production method (job, batch or flow) and how to keep quality high while controlling cost. Efficiency means producing more using fewer resources.','People in Business':'Workers are motivated by money and by things like recognition, responsibility and job security. Businesses use pay, bonuses and training to keep staff, and leadership styles range from autocratic (the boss decides) to democratic (staff are consulted). Always link a method to the business in the question.'},
chemistry:{'Acids & Bases':'Acids release hydrogen ions (H⁺) in water and bases neutralise them. The pH scale runs from 0 (strong acid) to 14 (strong alkali) with 7 neutral. In neutralisation an acid plus a base makes a salt plus water, and the acid decides the salt: sulfuric acid gives sulfates and hydrochloric acid gives chlorides.','Rates of Reaction':'A reaction happens when particles collide with enough energy, called the activation energy. Anything that makes collisions more frequent or more energetic speeds it up: higher temperature, concentration, pressure, surface area or a catalyst. Always explain in terms of collisions, not just “it goes faster”.'},
mathematics:{'Statistics & Probability':'Statistics summarises data with an average and a spread. The mean uses every value, the median is the middle and is not affected by extreme values, and the mode is the most common. Probability is the ways an event can happen divided by all outcomes, always between 0 and 1, and all outcomes add up to 1.','Geometry':'Geometry is about the rules shapes follow. Learn the angle facts: angles on a straight line add to 180°, around a point 360° and in a triangle 180°. Always state the reason beside each angle you find, because the marks come from naming the rule, such as “alternate angles are equal”.'},
computer:{'Data Representation':'Computers store everything as binary because circuits have two states, on and off. Each bit is a 1 or 0 and place values double from the right (1, 2, 4, 8…). Text uses a code that gives each character a number, images use pixels with colour values and sound is stored as samples of the wave.','Security & Ethics':'Security protects data from being stolen, damaged or lost. Threats include malware, phishing and unauthorised access; defences include passwords, firewalls, encryption and backups. Ethics asks whether something is right as well as legal, such as how a company uses personal data.'},
psychology:{'Research Methods':'Research methods are how psychologists test ideas fairly. Start with a clear hypothesis, then control everything except the independent variable so any change in the dependent variable is down to it. Choose a sample that represents the target group and follow ethical guidelines such as consent and the right to withdraw.','Development':'Development looks at how thinking changes through childhood. Piaget saw children moving through fixed stages, learning mostly by exploring; Vygotsky stressed that learning happens with help from others. A common question compares them: Piaget focuses on the child alone, Vygotsky on social support.'},
accounting:{'Fundamentals':'Every transaction affects the business in two ways, so it is recorded twice: this is double entry. A debit and a credit of equal size keep the accounting equation (assets = capital + liabilities) in balance. For each transaction ask what came in or increased, and what went out or was owed.','Ratios & Analysis':'Ratios turn raw figures into comparisons that show how well a business is doing. Profitability ratios compare profit with sales, liquidity ratios check it can pay short-term debts and efficiency ratios show how well assets are used. Never stop at the number: say what it means and compare it with last year or a rival.'},
biology:{'Cells & Microscopy':'Cells are the basic units of life, and each part has a job: the nucleus controls, mitochondria release energy and ribosomes build proteins. Plant cells add a cell wall, chloroplasts and a vacuole. Microscopes make cells visible, and the magnification equation (image ÷ real size) lets you work out real sizes from a drawing.','Photosynthesis & Respiration':'Photosynthesis and respiration are opposite processes. Plants capture light to build glucose and release oxygen; all living cells then break glucose down to release energy. Plants do both, but in the light photosynthesis usually outweighs respiration, which is why plants release oxygen overall.'}};
for(const k in G3)Object.assign(GUIDE[k],G3[k]);

function deck(s,np){

  m=x.match(/^(.{2,40}?) = (.+?)\.?$/);if(m){add('n'+id,'Formula',ch,m[1]+' =',m[2]);return}
  const w=x.replace(/<[^>]+>/g,'').split(' ');add('n'+id,'Finish it',ch,w.slice(0,Math.min(6,Math.ceil(w.length/3))).join(' ')+' …',x)}));
 s.quiz.forEach(([q,o],i)=>add('q'+i,'Quick check',s.title,q,o[0]));
 let k=0;for(let i=0;i<70&&k<120&&!np;i++){try{build(s,10).forEach(([q,o])=>{if(k<120&&!seen.has(q)){add('p'+k,'Practice','Practice',q,o.find(x=>x[1])[0],1);k++}})}catch(e){}}
 return out}
